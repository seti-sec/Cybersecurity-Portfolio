title: Suspicious LSASS Memory Access
id: b1a2c3d4-1111-4444-8888-abcdef123456
status: experimental
description: Detects suspicious process access to LSASS memory that may indicate credential dumping.
author: Your Name
date: 2026/07/30

references:
  - https://attack.mitre.org/techniques/T1003/001/

logsource:
  product: windows
  service: sysmon

detection:

  selection:
    EventID: 10
    TargetImage|endswith:
      - '\lsass.exe'

  condition: selection

falsepositives:
  - Security software
  - Endpoint protection tools
  - System monitoring tools

level: high

tags:
  - attack.credential_access
  - attack.t1003
  - attack.t1003.001
