title: Suspicious Kerberoasting Activity
id: c2d3e4f5-2222-4444-9999-fedcba654321
status: experimental
description: Detects suspicious Kerberos service ticket requests associated with Kerberoasting attacks.
author: Your Name
date: 2026/07/30

references:
  - https://attack.mitre.org/techniques/T1558/003/

logsource:
  product: windows
  service: security

detection:

  selection:
    EventID: 4769
    TicketEncryptionType:
      - "0x17"

  condition: selection

falsepositives:
  - Normal Kerberos authentication
  - Legacy applications
  - Service accounts

level: high

tags:
  - attack.credential_access
  - attack.t1558
  - attack.t1558.003
