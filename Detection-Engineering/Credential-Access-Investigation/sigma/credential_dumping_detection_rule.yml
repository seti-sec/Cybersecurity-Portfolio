title: Suspicious OS Credential Dumping Activity
id: 3b91d2a4-7c65-4f12-a9e8-1d8b7c6e2222
status: experimental
description: Detects suspicious processes and access attempts related to credential dumping.
author: Your Name
date: 2026/07/28

references:
  - https://attack.mitre.org/techniques/T1003/

logsource:
  product: windows
  service: security

detection:
  selection_process:
    EventID: 4688
    NewProcessName|endswith:
      - '\mimikatz.exe'
      - '\procdump.exe'
      - '\rundll32.exe'

  selection_access:
    EventID:
      - 4656
      - 4663

  condition: selection_process or selection_access

falsepositives:
  - Security monitoring tools
  - Antivirus software
  - Authorized forensic tools

level: critical

tags:
  - attack.credential_access
  - attack.t1003
  - attack.t1003.001
  - attack.t1003.002
